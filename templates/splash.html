<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TikTok MC Integrator</title>
<style>
  /* Self-contained: this file loads via file:// BEFORE Flask is up, so it can
     depend on NOTHING external — no fonts from the server, no CSS from /static.
     Pixelify Sans falls back to a pixel-ish system stack if the web font (loaded
     opportunistically below) hasn't arrived yet. */
  @font-face {
    font-family: 'Pixelify Sans';
    src: local('Pixelify Sans');
    font-display: swap;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --wood: #5a3c20;
    --wood-lt: #8a5e34;
    --wood-dk: #2e1d0f;
    --bg-base: #14181f;
    --bg-surface: #262b38;
    --text: #f2e6cf;
    --text-muted: #b8a98a;
    --cyan: #25f4ee;
    --pink: #fe2c55;
  }
  html, body {
    height: 100%;
    width: 100%;
    overflow: hidden;
    background: var(--bg-base);
    background-image:
      radial-gradient(circle at 20% 20%, rgba(37,244,238,.08), transparent 40%),
      radial-gradient(circle at 80% 80%, rgba(254,44,85,.08), transparent 40%),
      linear-gradient(160deg, #14181f 0%, #1b212c 100%);
    font-family: 'Pixelify Sans', 'Trebuchet MS', monospace;
    color: var(--text);
    -webkit-user-select: none;
    user-select: none;
    cursor: default;
  }
  .stage {
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    image-rendering: pixelated;
  }
  /* Wood-frame panel matching the dashboard card aesthetic */
  .panel {
    background: var(--bg-surface);
    padding: 38px 54px;
    box-shadow:
      inset 0 0 0 2px var(--wood-lt),
      inset 0 0 0 6px var(--wood),
      0 4px 0 rgba(0,0,0,.45),
      0 6px 20px rgba(0,0,0,.45);
    border-radius: 4px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    min-width: 320px;
  }
  .diamond {
    width: 72px; height: 72px;
    position: relative;
    animation: bob 1.8s ease-in-out infinite;
  }
  .diamond svg { width: 100%; height: 100%; display: block; }
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-8px); }
  }
  .title {
    font-size: 26px;
    letter-spacing: 1px;
    background: linear-gradient(135deg, var(--cyan), var(--pink));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    text-align: center;
  }
  .subtitle {
    font-size: 14px;
    color: var(--text-muted);
    text-align: center;
    min-height: 18px;
  }
  /* Pixel loading bar */
  .bar {
    width: 240px;
    height: 16px;
    background: var(--bg-base);
    box-shadow: inset 0 0 0 2px var(--wood);
    padding: 2px;
    display: flex;
    gap: 2px;
    overflow: hidden;
  }
  .pip {
    flex: 1;
    background: var(--wood-dk);
    transition: background .2s;
  }
  .pip.on { background: linear-gradient(180deg, var(--cyan), #1aa39e); }
  .hint {
    font-size: 11px;
    color: var(--text-muted);
    opacity: .65;
    text-align: center;
    max-width: 300px;
    line-height: 1.5;
  }
</style>
</head>

      <div class="title">TikTok&nbsp;MC&nbsp;Integrator</div>
      <div class="bar" id="bar"></div>
      <div class="subtitle" id="status">Starting up…</div>
    </div>
    <div class="hint" id="hint">Booting the server and song queue. This only takes a moment.</div>
  </div>

<script>
  // ── Pixel loading bar animation ──────────────────────────────────────
  var PIPS = 12;
  var bar = document.getElementById('bar');
  var pips = [];
  for (var i = 0; i < PIPS; i++) {
    var p = document.createElement('div');
    p.className = 'pip';
    bar.appendChild(p);
    pips.push(p);
  }
  var pos = 0;
  setInterval(function () {
    for (var i = 0; i < PIPS; i++) {
      // moving comet of 4 lit pips
      var d = (i - pos + PIPS) % PIPS;
      pips[i].classList.toggle('on', d < 4);
    }
    pos = (pos + 1) % PIPS;
  }, 110);

  // ── Health poll → swap to the app when Flask is ready ────────────────
  var PORT = 5000;
  var BASE = 'http://localhost:' + PORT;
  var statusEl = document.getElementById('status');
  var hintEl = document.getElementById('hint');
  var attempts = 0;
  var redirected = false;

  function go(url) {
    if (redirected) return;
    redirected = true;
    statusEl.textContent = 'Ready!';
    setTimeout(function () { window.location.href = url; }, 220);
  }

  function poll() {
    if (redirected) return;
    attempts++;
    // Soft messaging so a slightly slow boot never feels broken/frozen.
    if (attempts === 15) statusEl.textContent = 'Almost there…';
    if (attempts === 50) {
      statusEl.textContent = 'Still starting…';
      hintEl.textContent = 'First launch can take a little longer while files unpack.';
    }
    if (attempts === 150) {
      hintEl.textContent = 'Taking longer than usual — hang tight, still trying to connect.';
    }

    fetch(BASE + '/health', { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : Promise.reject(); })
      .then(function (data) {
        // Always land on '/'; the server decides dashboard vs. wizard based on
        // first-run state. Keeps the splash dumb and the routing in one place.
        go(BASE + '/');
      })
      .catch(function () {
        // Not up yet — keep polling. 200ms cadence per fusion-panel guidance.
        setTimeout(poll, 200);
      });
  }
  // Kick off shortly after paint so the splash is visibly drawn first.
  setTimeout(poll, 150);
</script>
